services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-vortex}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_PORT:-5432}:5432"

  cache:
    image: docker.io/valkey/valkey:8-alpine
    command: ["valkey-server", "--requirepass", "${CACHE_PASSWORD:?CACHE_PASSWORD is required}"]
    volumes:
      - cache_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${CACHE_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${CACHE_PORT:-6379}:6379"

  events:
    image: apache/iggy:latest
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      IGGY_ROOT_USERNAME: ${IGGY_USERNAME:-iggy}
      IGGY_ROOT_PASSWORD: ${IGGY_PASSWORD:-iggy}
    volumes:
      - events_data:/local_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${EVENTS_TCP_PORT:-8090}:8090"
      - "${EVENTS_HTTP_PORT:-8080}:8080"

  api:
    image: ghcr.io/omnidotdev/vortex-api:latest
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-vortex}
      CACHE_URL: redis://default:${CACHE_PASSWORD}@cache:6379
      EVENTS_URL: iggy://events:8090
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      PORT: "4000"
      HOST: "0.0.0.0"
      NODE_ENV: production
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      events:
        condition: service_healthy
    ports:
      - "${API_PORT:-4000}:4000"

  app:
    image: ghcr.io/omnidotdev/vortex-app:latest
    environment:
      NODE_ENV: production
      VITE_BASE_URL: http://localhost:3000
      VITE_API_BASE_URL: http://api:4000
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      # OAuth providers (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    depends_on:
      - api
    ports:
      - "${APP_PORT:-3000}:3000"

  worker:
    image: ghcr.io/omnidotdev/vortex-worker:latest
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-vortex}
      CACHE_URL: redis://default:${CACHE_PASSWORD}@cache:6379
      EVENTS_URL: iggy://events:8090
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      events:
        condition: service_healthy

volumes:
  db_data:
  cache_data:
  events_data:
