apiVersion: v1
kind: Service
metadata:
  name: {{ include "vortex.fullname" . }}-worker
  labels:
    {{- include "vortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.worker.healthPort }}
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "vortex.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
