apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vortex.fullname" . }}
  labels:
    {{- include "vortex.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ include "vortex.databaseUrl" . | quote }}
  auth-secret: {{ .Values.secrets.authSecret | quote }}
  encryption-key: {{ .Values.secrets.encryptionKey | quote }}
  hatchet-client-token: {{ .Values.secrets.hatchetClientToken | quote }}
  internal-api-secret: {{ .Values.secrets.internalApiSecret | quote }}
  {{- with .Values.secrets.authClientSecret }}
  auth-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.billingWebhookSecret }}
  billing-webhook-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.idpWebhookSecret }}
  idp-webhook-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.iggyUsername }}
  iggy-username: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.iggyPassword }}
  iggy-password: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.stripeApiKey }}
  stripe-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.stripeWebhookSecret }}
  stripe-webhook-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.emailWebhookSecret }}
  email-webhook-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.billingServiceApiKey }}
  billing-service-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.authWebhookSecret }}
  auth-webhook-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.authzWebhookSecret }}
  authz-webhook-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.searchBootstrapWebhookSecret }}
  search-bootstrap-webhook-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.auditWebhookSecret }}
  audit-webhook-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.resendApiKey }}
  resend-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.emailRenderSecret }}
  email-render-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.wardenServiceKey }}
  warden-service-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.mantleServiceKey }}
  mantle-service-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.aetherServiceApiKey }}
  aether-service-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.meilisearchMasterKey }}
  meilisearch-master-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.flagsClientKeyApi }}
  flags-client-key-api: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.flagsClientKeyApp }}
  flags-client-key-app: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.otelHeaders }}
  otel-headers: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubOauthClientId }}
  github-oauth-client-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubOauthClientSecret }}
  github-oauth-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.discordOauthClientId }}
  discord-oauth-client-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.discordOauthClientSecret }}
  discord-oauth-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.slackOauthClientId }}
  slack-oauth-client-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.slackOauthClientSecret }}
  slack-oauth-client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.googleOauthClientId }}
  google-oauth-client-id: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.googleOauthClientSecret }}
  google-oauth-client-secret: {{ . | quote }}
  {{- end }}
