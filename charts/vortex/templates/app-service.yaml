apiVersion: v1
kind: Service
metadata:
  name: {{ include "vortex.fullname" . }}-app
  labels:
    {{- include "vortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.app.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vortex.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
