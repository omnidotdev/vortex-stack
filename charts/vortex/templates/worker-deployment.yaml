apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vortex.fullname" . }}-worker
  labels:
    {{- include "vortex.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "vortex.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "vortex.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          ports:
            - name: health
              containerPort: {{ .Values.worker.healthPort }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: database-url
            - name: HATCHET_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: hatchet-client-token
            {{- with .Values.worker.hatchet.tlsStrategy }}
            - name: HATCHET_CLIENT_TLS_STRATEGY
              value: {{ . | quote }}
            {{- end }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: encryption-key
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: internal-api-secret
            - name: VORTEX_EXECUTOR
              value: {{ .Values.worker.executor | quote }}
            - name: HEALTH_PORT
              value: {{ .Values.worker.healthPort | quote }}
            - name: NODE_ENV
              value: production
            {{- with .Values.worker.events.url }}
            - name: EVENTS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.secrets.iggyUsername }}
            - name: IGGY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: iggy-username
            {{- end }}
            {{- if .Values.secrets.iggyPassword }}
            - name: IGGY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: iggy-password
            {{- end }}
            {{- with .Values.worker.logLevel }}
            - name: LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.worker.vortexApiUrl }}
            - name: VORTEX_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.worker.vortexPublicUrl }}
            - name: VORTEX_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.worker.vortexCallbackBaseUrl }}
            - name: VORTEX_CALLBACK_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.worker.cache.url }}
            - name: CACHE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.secrets.resendApiKey }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: resend-api-key
            {{- end }}
            {{- with .Values.worker.warden.apiUrl }}
            - name: AUTHZ_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.secrets.wardenServiceKey }}
            - name: AUTHZ_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: warden-service-key
            {{- end }}
            {{- with .Values.worker.aether.apiUrl }}
            - name: BILLING_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.secrets.aetherServiceApiKey }}
            - name: BILLING_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: aether-service-api-key
            {{- end }}
            {{- with .Values.worker.chronicle.apiUrl }}
            - name: CHRONICLE_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.worker.mantle.apiUrl }}
            - name: MANTLE_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.secrets.mantleServiceKey }}
            - name: MANTLE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: mantle-service-key
            {{- end }}
            {{- with .Values.worker.gatekeeper.apiUrl }}
            - name: AUTH_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.secrets.emailRenderSecret }}
            - name: EMAIL_RENDER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: email-render-secret
            {{- end }}
            {{- with .Values.worker.meilisearch.url }}
            - name: MEILISEARCH_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.secrets.meilisearchMasterKey }}
            - name: MEILISEARCH_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: meilisearch-master-key
            {{- end }}
            {{- with .Values.worker.runa.apiUrl }}
            - name: RUNA_API_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.worker.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.worker.otel.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.secrets.otelHeaders }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: otel-headers
            {{- end }}
            {{- with .Values.worker.temporal.address }}
            - name: TEMPORAL_ADDRESS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.worker.temporal.namespace }}
            - name: TEMPORAL_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.worker.temporal.taskQueue }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.secrets.githubOauthClientId }}
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: github-oauth-client-id
            {{- end }}
            {{- if .Values.secrets.githubOauthClientSecret }}
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: github-oauth-client-secret
            {{- end }}
            {{- if .Values.secrets.discordOauthClientId }}
            - name: DISCORD_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: discord-oauth-client-id
            {{- end }}
            {{- if .Values.secrets.discordOauthClientSecret }}
            - name: DISCORD_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: discord-oauth-client-secret
            {{- end }}
            {{- if .Values.secrets.slackOauthClientId }}
            - name: SLACK_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: slack-oauth-client-id
            {{- end }}
            {{- if .Values.secrets.slackOauthClientSecret }}
            - name: SLACK_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: slack-oauth-client-secret
            {{- end }}
            {{- if .Values.secrets.googleOauthClientId }}
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: google-oauth-client-id
            {{- end }}
            {{- if .Values.secrets.googleOauthClientSecret }}
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vortex.fullname" . }}
                  key: google-oauth-client-secret
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.worker.healthPort }}
            failureThreshold: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.worker.healthPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.worker.healthPort }}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
